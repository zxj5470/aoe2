<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帝国时代2 Web版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #resource-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45px;
            background: rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            border-bottom: 2px solid #8B4513;
            z-index: 100;
        }
        
        .resource-left {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .resource-display {
            display: flex;
            gap: 35px;
            color: #FFD700;
            font-size: 14px;
            font-weight: bold;
        }
        
        .resource-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .resource-item span:first-child {
            font-size: 18px;
        }
        
        .population-display {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #FFD700;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 10px;
            background: rgba(139, 69, 19, 0.5);
            border: 1px solid #8B4513;
            border-radius: 3px;
        }
        
        .age-display {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            padding: 5px 20px;
            background: rgba(139, 69, 19, 0.7);
            border: 2px solid #8B4513;
            border-radius: 5px;
        }
        
        #hud {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 180px;
            background: rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            border-top: 2px solid #8B4513;
            display: flex;
            z-index: 100;
        }
        
        .hud-panel {
            padding: 10px;
            color: #FFD700;
            border-right: 1px solid #8B4513;
        }
        
        .hud-panel:last-child {
            border-right: none;
        }
        
        .hud-panel-left {
            flex: 0 0 280px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
        }
        
        .hud-panel-center {
            flex: 1;
            min-width: 300px;
        }
        
        .hud-panel-right {
            flex: 0 0 220px;
            min-width: 220px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .panel-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid #8B4513;
            padding-bottom: 5px;
        }
        
        .building-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 4px;
            flex: 1;
        }
        
        .building-btn {
            position: relative;
            padding: 0;
            background: #5a3d2b;
            color: #FFD700;
            border: 2px solid #8B4513;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            overflow: hidden;
            aspect-ratio: 1;
        }
        
        .building-btn:hover {
            background: #8B4513;
            border-color: #FFD700;
        }
        
        .building-btn.active {
            background: #8B4513;
            border-color: #00FF00;
        }
        
        .building-btn-empty {
            background: transparent !important;
            border: 2px solid transparent !important;
            cursor: default;
            pointer-events: none;
        }
        
        .building-btn-empty .building-btn-icon,
        .building-btn-empty .building-btn-text {
            display: none;
        }
        
        .building-btn-nav {
            background: #4a2d1b !important;
            border-color: #8B4513 !important;
            font-size: 20px;
        }
        
        .building-btn-nav:hover {
            background: #6a3d2b !important;
            border-color: #FFD700 !important;
        }
        
        .building-btn-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            z-index: 1;
        }
        
        .building-btn-text {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            z-index: 2;
            opacity: 0.9;
        }
        
        .unit-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        
        .health-bar {
            width: 100%;
            height: 16px;
            background: #333;
            border: 1px solid #8B4513;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .health-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00FF00, #90EE90);
            transition: width 0.3s;
        }
        
        #minimap {
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8B4513;
            pointer-events: auto;
            position: relative;
            cursor: pointer;
        }
        
        #minimap-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #debug-panel {
            position: absolute;
            top: 50px;
            right: 10px;
            width: 250px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00FF00;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 10px;
            z-index: 1000;
            display: none;
        }
        
        #debug-panel.visible {
            display: block;
        }
        
        .debug-section {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #00FF00;
        }
        
        .debug-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .debug-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #00FF00;
        }
        
        .debug-row {
            margin: 2px 0;
        }
        
        .debug-label {
            color: #888;
        }
        
        .debug-value {
            color: #00FF00;
        }
        
        /* 建筑面板配置变量 */
        :root {
            --building-grid-rows: 3;
            --building-grid-cols: 5;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #FFD700;
            z-index: 1000;
        }
        
        .loading-text {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .loading-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border: 2px solid #8B4513;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #8B4513, #FFD700);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui-layer">
            <div id="loading-screen" class="loading-screen">
                <div class="loading-text">帝国时代2 Web版</div>
                <div class="loading-bar">
                    <div class="loading-progress" id="loading-progress"></div>
                </div>
            </div>
            
            <div id="resource-bar">
                <div class="resource-left">
                    <div class="resource-display">
                        <div class="resource-item">
                            <span>🍖</span>
                            <span id="resource-food">0</span>
                        </div>
                        <div class="resource-item">
                            <span>🌲</span>
                            <span id="resource-wood">0</span>
                        </div>
                        <div class="resource-item">
                            <span>🏅</span>
                            <span id="resource-gold">0</span>
                        </div>
                        <div class="resource-item">
                            <span>🪨</span>
                            <span id="resource-stone">0</span>
                        </div>
                    </div>
                    <div class="population-display">
                        <span>🏠</span>
                        <span id="population-current">1</span>
                        <span>/</span>
                        <span id="population-max">20</span>
                    </div>
                </div>
                <div class="age-display">
                    <span id="current-age">黑暗时代</span>
                </div>
            </div>
            
            <div id="hud">
                <div class="hud-panel hud-panel-left">
                    <div class="building-buttons">
                        <button class="building-btn" data-building="house">
                            <span class="building-btn-icon">🏠</span>
                            <span class="building-btn-text">房屋</span>
                        </button>
                        <button class="building-btn" data-building="barracks">
                            <span class="building-btn-icon">⚔️</span>
                            <span class="building-btn-text">兵营</span>
                        </button>
                        <button class="building-btn" data-building="stable">
                            <span class="building-btn-icon">🐴</span>
                            <span class="building-btn-text">马厩</span>
                        </button>
                        <button class="building-btn" data-building="archery">
                            <span class="building-btn-icon">🏹</span>
                            <span class="building-btn-text">射箭场</span>
                        </button>
                        <button class="building-btn" data-building="farm">
                            <span class="building-btn-icon">🌾</span>
                            <span class="building-btn-text">农田</span>
                        </button>
                        <button class="building-btn" data-building="lumber">
                            <span class="building-btn-icon">🌲</span>
                            <span class="building-btn-text">伐木场</span>
                        </button>
                        <button class="building-btn" data-building="mine">
                            <span class="building-btn-icon">⛏️</span>
                            <span class="building-btn-text">采矿场</span>
                        </button>
                        <button class="building-btn" data-building="tower">
                            <span class="building-btn-icon">🗼</span>
                            <span class="building-btn-text">瞭望塔</span>
                        </button>
                        <button class="building-btn" data-building="castle">
                            <span class="building-btn-icon">🏰</span>
                            <span class="building-btn-text">城堡</span>
                        </button>
                        <button class="building-btn" data-building="wall">
                            <span class="building-btn-icon">🧱</span>
                            <span class="building-btn-text">城墙</span>
                        </button>
                        <button class="building-btn" data-building="gate">
                            <span class="building-btn-icon">🚪</span>
                            <span class="building-btn-text">城门</span>
                        </button>
                        <button class="building-btn" data-building="blacksmith">
                            <span class="building-btn-icon">⚒️</span>
                            <span class="building-btn-text">铁匠铺</span>
                        </button>
                        <button class="building-btn" data-building="market">
                            <span class="building-btn-icon">🏪</span>
                            <span class="building-btn-text">市场</span>
                        </button>
                        <button class="building-btn" data-building="dock">
                            <span class="building-btn-icon">⚓</span>
                            <span class="building-btn-text">码头</span>
                        </button>
                        <button class="building-btn" data-building="church">
                            <span class="building-btn-icon">⛪</span>
                            <span class="building-btn-text">教堂</span>
                        </button>
                    </div>
                </div>
                
                <div class="hud-panel hud-panel-center">
                    <div class="panel-title">单位信息</div>
                    <div id="unit-info-content" class="unit-info">
                        <div style="color: #888; text-align: center; padding: 40px 0;">
                            未选择任何单位
                        </div>
                    </div>
                </div>
                
                <div class="hud-panel hud-panel-right">
                    <div id="minimap">
                        <canvas id="minimap-canvas"></canvas>
                    </div>
                </div>
            </div>
            
            <div id="debug-panel">
                <div class="debug-section">
                    <div class="debug-title">相机位置</div>
                    <div class="debug-row"><span class="debug-label">Position:</span> <span class="debug-value" id="debug-position">-</span></div>
                    <div class="debug-row"><span class="debug-label">Target:</span> <span class="debug-value" id="debug-target">-</span></div>
                    <div class="debug-row"><span class="debug-label">Zoom:</span> <span class="debug-value" id="debug-zoom">-</span></div>
                </div>
                <div class="debug-section">
                    <div class="debug-title">小地图视野</div>
                    <div class="debug-row"><span class="debug-label">西北角:</span> <span class="debug-value" id="debug-nw">-</span></div>
                    <div class="debug-row"><span class="debug-label">东北角:</span> <span class="debug-value" id="debug-ne">-</span></div>
                    <div class="debug-row"><span class="debug-label">东南角:</span> <span class="debug-value" id="debug-se">-</span></div>
                    <div class="debug-row"><span class="debug-label">西南角:</span> <span class="debug-value" id="debug-sw">-</span></div>
                </div>
                <div class="debug-section">
                    <div class="debug-title">地图范围</div>
                    <div class="debug-row"><span class="debug-label">X范围:</span> <span class="debug-value" id="debug-map-width">-</span></div>
                    <div class="debug-row"><span class="debug-label">Z范围:</span> <span class="debug-value" id="debug-map-height">-</span></div>
                </div>
                <div class="debug-section">
                    <div class="debug-title">建筑面板配置</div>
                    <div class="debug-row"><span class="debug-label">行数:</span> <span class="debug-value" id="debug-panel-rows">-</span></div>
                    <div class="debug-row"><span class="debug-label">列数:</span> <span class="debug-value" id="debug-panel-cols">-</span></div>
                    <div class="debug-row"><span class="debug-label">按钮数:</span> <span class="debug-value" id="debug-panel-buttons">-</span></div>
                    <div class="debug-row" style="margin-top: 5px; color: #888;">按1/2/3切换布局</div>
                    <div class="debug-row" style="color: #888;">按V切换预设</div>
                    <div class="debug-row" style="color: #888;">按Q/E: 空白/启用兵营</div>
                    <div class="debug-row" style="color: #888;">按R: 重置所有按钮</div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
