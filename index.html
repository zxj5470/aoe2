<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帝国时代2 Web版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #hud {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            border-top: 2px solid #8B4513;
        }
        
        .resource-display {
            display: flex;
            gap: 20px;
            padding: 10px;
            color: #FFD700;
            font-size: 14px;
        }
        
        .resource-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #minimap {
            position: absolute;
            bottom: 160px;
            right: 10px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8B4513;
            pointer-events: auto;
        }
        
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #FFD700;
            z-index: 1000;
        }
        
        .loading-text {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .loading-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border: 2px solid #8B4513;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #8B4513, #FFD700);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div id="ui-layer">
            <div id="loading-screen" class="loading-screen">
                <div class="loading-text">帝国时代2 Web版</div>
                <div class="loading-bar">
                    <div class="loading-progress" id="loading-progress"></div>
                </div>
            </div>
            <div id="minimap">
                <canvas id="minimap-canvas"></canvas>
            </div>
            <div id="hud">
                <div class="resource-display">
                    <div class="resource-item">
                        <span>🏠</span>
                        <span id="resource-gold">0</span>
                    </div>
                    <div class="resource-item">
                        <span>🌲</span>
                        <span id="resource-wood">0</span>
                    </div>
                    <div class="resource-item">
                        <span>🍖</span>
                        <span id="resource-food">0</span>
                    </div>
                    <div class="resource-item">
                        <span>🪨</span>
                        <span id="resource-stone">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
